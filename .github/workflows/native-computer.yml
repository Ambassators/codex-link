name: Native computer backends
on:
  push:
    paths: ['computer/**', 'src/native-computer*', 'scripts/build-computer.mjs', 'test/native-computer.test.mjs', '.github/workflows/native-computer.yml']
  pull_request:
    paths: ['computer/**', 'src/native-computer*', 'scripts/build-computer.mjs', 'test/native-computer.test.mjs', '.github/workflows/native-computer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, platform: darwin, arch: arm64 }
          - { os: macos-latest, platform: darwin, arch: x64 }
          - { os: windows-latest, platform: win32, arch: x64 }
          - { os: windows-latest, platform: win32, arch: arm64 }
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: node scripts/build-computer.mjs --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: computer/bin/${{ matrix.platform }}-${{ matrix.arch }}/
          if-no-files-found: error
